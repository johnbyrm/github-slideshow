<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>3D Solar System Simulation</title>
  <style>
    :root {
      color-scheme: dark;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background: radial-gradient(circle at top, #1b2735 0%, #090a0f 80%);
      color: #f1f5f9;
    }

    header {
      padding: 1.5rem 1rem 0.5rem;
      text-align: center;
    }

    h1 {
      margin: 0 0 0.5rem;
      font-size: clamp(1.8rem, 4vw, 2.75rem);
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    p {
      margin: 0 auto;
      max-width: 52ch;
      line-height: 1.6;
      font-size: 0.95rem;
      opacity: 0.8;
    }

    #viewer {
      flex: 1;
      position: relative;
      min-height: 60vh;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    footer {
      text-align: center;
      padding: 0.75rem 1rem 1.5rem;
      font-size: 0.8rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      opacity: 0.6;
    }

    .legend {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
      gap: 0.75rem;
      margin: 1rem auto 0;
      max-width: 60rem;
      padding: 0 1rem;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      background: rgba(15, 23, 42, 0.45);
      border: 1px solid rgba(148, 163, 184, 0.15);
      border-radius: 999px;
      padding: 0.4rem 0.8rem;
      backdrop-filter: blur(6px);
    }

    .legend-color {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      flex-shrink: 0;
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/three@0.159.0/build/three.min.js" integrity="sha384-3Yd2+taqowuF0k/FYH5DhcE4cyRfXjl9LNdf+RsV7lvQkZ5WnD1Sn01ZTndbRT3q" crossorigin="anonymous"></script>
</head>
<body>
  <header>
    <h1>3D Solar System Simulation</h1>
    <p>
      Explore a simplified model of our solar system. Planets orbit the sun in scaled-down
      distances and speeds while a field of distant stars provides depth.
    </p>
    <div class="legend" id="legend"></div>
  </header>

  <main id="viewer"></main>

  <footer>Click and drag to look around • Scroll to zoom</footer>

  <script>
    const container = document.getElementById("viewer");
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.setSize(container.clientWidth, container.clientHeight);
    container.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x04060d, 0.0009);

    const camera = new THREE.PerspectiveCamera(
      45,
      container.clientWidth / container.clientHeight,
      0.1,
      1000
    );
    camera.position.set(-60, 45, 80);

    const ambientLight = new THREE.AmbientLight(0x404070, 1.1);
    scene.add(ambientLight);

    const sunLight = new THREE.PointLight(0xffcc88, 2.6, 0, 2);
    scene.add(sunLight);

    const sunGeometry = new THREE.SphereGeometry(6, 64, 64);
    const sunMaterial = new THREE.MeshStandardMaterial({
      emissive: 0xffa733,
      emissiveIntensity: 1.8,
      color: 0x333300,
    });
    const sun = new THREE.Mesh(sunGeometry, sunMaterial);
    scene.add(sun);

    const starGeometry = new THREE.BufferGeometry();
    const starCount = 4000;
    const starVertices = new Float32Array(starCount * 3);
    for (let i = 0; i < starCount; i++) {
      const radius = THREE.MathUtils.randFloat(200, 600);
      const theta = THREE.MathUtils.randFloat(0, Math.PI * 2);
      const phi = THREE.MathUtils.randFloat(0, Math.PI);
      const x = radius * Math.sin(phi) * Math.cos(theta);
      const y = radius * Math.sin(phi) * Math.sin(theta);
      const z = radius * Math.cos(phi);
      starVertices.set([x, y, z], i * 3);
    }
    starGeometry.setAttribute("position", new THREE.BufferAttribute(starVertices, 3));
    const starMaterial = new THREE.PointsMaterial({ color: 0xffffff, size: 0.8, sizeAttenuation: true });
    const starField = new THREE.Points(starGeometry, starMaterial);
    scene.add(starField);

    const planetData = [
      { name: "Mercury", color: "#c0c0c0", size: 0.6, distance: 10, speed: 0.017 },
      { name: "Venus", color: "#dca266", size: 0.9, distance: 14, speed: 0.012 },
      { name: "Earth", color: "#3fa7ff", size: 1, distance: 18, speed: 0.01 },
      { name: "Mars", color: "#e66b4c", size: 0.8, distance: 22, speed: 0.008 },
      { name: "Jupiter", color: "#d2b48c", size: 2.4, distance: 30, speed: 0.004 },
      { name: "Saturn", color: "#e1c699", size: 2.1, distance: 38, speed: 0.003 },
      { name: "Uranus", color: "#8cc7de", size: 1.5, distance: 46, speed: 0.002 },
      { name: "Neptune", color: "#5a7bd8", size: 1.5, distance: 54, speed: 0.0015 },
    ];

    const planets = [];
    const legend = document.getElementById("legend");

    planetData.forEach((planet) => {
      const orbit = new THREE.Object3D();
      scene.add(orbit);

      const planetGeometry = new THREE.SphereGeometry(planet.size, 48, 48);
      const planetMaterial = new THREE.MeshStandardMaterial({ color: planet.color, roughness: 0.8, metalness: 0.2 });
      const planetMesh = new THREE.Mesh(planetGeometry, planetMaterial);
      planetMesh.position.set(planet.distance, 0, 0);
      orbit.add(planetMesh);

      const ringMaterial = new THREE.LineBasicMaterial({ color: 0x334155, transparent: true, opacity: 0.35 });
      const ringGeometry = new THREE.BufferGeometry();
      const segments = 128;
      const ringVertices = new Float32Array(segments * 3);
      for (let i = 0; i < segments; i++) {
        const angle = (i / segments) * Math.PI * 2;
        ringVertices[i * 3] = Math.cos(angle) * planet.distance;
        ringVertices[i * 3 + 1] = 0;
        ringVertices[i * 3 + 2] = Math.sin(angle) * planet.distance;
      }
      ringGeometry.setAttribute("position", new THREE.BufferAttribute(ringVertices, 3));
      const orbitRing = new THREE.LineLoop(ringGeometry, ringMaterial);
      scene.add(orbitRing);

      planets.push({ pivot: orbit, mesh: planetMesh, data: planet });

      const item = document.createElement("div");
      item.className = "legend-item";
      item.innerHTML = `
        <span class="legend-color" style="background:${planet.color}"></span>
        <span>${planet.name}</span>
      `;
      legend.appendChild(item);
    });

    const saturn = planets.find((p) => p.data.name === "Saturn");
    if (saturn) {
      const ringGeometry = new THREE.RingGeometry(saturn.data.size * 0.9, saturn.data.size * 1.8, 64);
      const ringMaterial = new THREE.MeshStandardMaterial({
        color: 0xc8bca8,
        side: THREE.DoubleSide,
        transparent: true,
        opacity: 0.65,
      });
      const ring = new THREE.Mesh(ringGeometry, ringMaterial);
      ring.rotation.x = Math.PI / 2;
      saturn.mesh.add(ring);
    }

    const controls = new (function createControls() {
      const state = {
        isDragging: false,
        previousMousePosition: { x: 0, y: 0 },
        azimuth: -0.8,
        polar: 0.9,
        radius: 90,
      };

      const onMouseDown = (event) => {
        state.isDragging = true;
        state.previousMousePosition.x = event.clientX;
        state.previousMousePosition.y = event.clientY;
      };

      const onMouseMove = (event) => {
        if (!state.isDragging) return;
        const deltaMove = {
          x: event.clientX - state.previousMousePosition.x,
          y: event.clientY - state.previousMousePosition.y,
        };

        state.azimuth -= deltaMove.x * 0.005;
        state.polar = THREE.MathUtils.clamp(state.polar - deltaMove.y * 0.005, 0.1, Math.PI - 0.1);
        state.previousMousePosition.x = event.clientX;
        state.previousMousePosition.y = event.clientY;
      };

      const onMouseUp = () => {
        state.isDragging = false;
      };

      const onWheel = (event) => {
        state.radius = THREE.MathUtils.clamp(state.radius + event.deltaY * 0.05, 30, 180);
      };

      container.addEventListener("mousedown", onMouseDown);
      window.addEventListener("mousemove", onMouseMove);
      window.addEventListener("mouseup", onMouseUp);
      container.addEventListener("wheel", onWheel, { passive: true });

      return state;
    })();

    function updateCameraPosition() {
      const x = controls.radius * Math.sin(controls.polar) * Math.cos(controls.azimuth);
      const y = controls.radius * Math.cos(controls.polar);
      const z = controls.radius * Math.sin(controls.polar) * Math.sin(controls.azimuth);
      camera.position.set(x, y, z);
      camera.lookAt(0, 0, 0);
    }

    let lastTime = 0;
    function animate(timestamp) {
      const delta = (timestamp - lastTime) / 1000 || 0;
      lastTime = timestamp;

      planets.forEach(({ pivot, data }) => {
        pivot.rotation.y += data.speed * delta * 60;
      });

      sun.rotation.y += 0.0005 * delta * 60;

      updateCameraPosition();
      renderer.render(scene, camera);
      requestAnimationFrame(animate);
    }

    requestAnimationFrame(animate);

    function handleResize() {
      const { clientWidth, clientHeight } = container;
      renderer.setSize(clientWidth, clientHeight);
      camera.aspect = clientWidth / clientHeight;
      camera.updateProjectionMatrix();
    }

    window.addEventListener("resize", handleResize);
    handleResize();
  </script>
</body>
</html>
